name: Kahani video banao

on:
  push:
    paths:
      - "trigger/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Python packages
        run: |
          pip install -q --upgrade pip
          pip install -q numpy requests edge-tts pillow opencv-python-headless

      - name: Node playwright
        run: |
          npm install -g playwright
          npx --yes playwright install --with-deps chromium

      - name: Awaaz aur images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          EP=studio/series/rampur/ep01_bandh.json
          OUT=studio/series/rampur/ep01_assets
          mkdir -p "$OUT"
          python studio/gen_assets.py "$EP" "$OUT"

      - name: Video render
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          export NODE_PATH="$(npm root -g)"
          EP=studio/series/rampur/ep01_bandh.json
          OUT=studio/series/rampur/ep01_assets
          python studio/story_video.py "$EP" "$OUT" rampur.mp4 --w 1280 --h 720

      - name: Video upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            rampur.mp4
            *.srt
          if-no-files-found: warn
          retention-days: 14
