name: story audio (sarvam natural voice)

on:
  workflow_dispatch:
  push:
    paths: [".story-trigger"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy requests imageio-ffmpeg edge-tts
      - name: render (sarvam, ek hi awaaz, smooth)
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_API_KEY_2: ${{ secrets.SARVAM_API_KEY_2 }}
          SARVAM_API_KEY_3: ${{ secrets.SARVAM_API_KEY_3 }}
          STORY_ENGINE: sarvam
          SARVAM_MODEL: bulbul:v3
          SARVAM_NATURAL: "1"
        run: |
          mkdir -p output
          python tools/story_audio.py --out output/kahani-v4.mp3
          ls -lh output/
      - uses: actions/upload-artifact@v4
        with:
          name: kahani-v4
          path: output/kahani-v4.*
          retention-days: 7
