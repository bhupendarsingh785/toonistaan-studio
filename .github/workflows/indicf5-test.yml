name: indicf5-test

on:
  push:
    paths:
      - ".indicf5-trigger"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q "numpy==1.26.4" "pyarrow==15.0.2"
          pip install -q "git+https://github.com/ai4bharat/IndicF5.git" 2>&1 | tail -3
          # naya transformers + hub (model ka remote code inhi ke saath likha gaya hai)
          pip install -q -U transformers huggingface_hub 2>&1 | tail -3
          pip install -q accelerate 2>&1 | tail -2
          pip install -q --no-deps "pyarrow==15.0.2" "numpy==1.26.4"
          python -c "import transformers, huggingface_hub; print('tf', transformers.__version__, 'hub', huggingface_hub.__version__)"
      - name: render (f5_tts api, transformers ke bina)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY' 2>&1 | tee indicf5_log.txt
          import os, traceback
          from huggingface_hub import hf_hub_download
          tok = os.environ.get("HF_TOKEN")
          print("token present:", bool(tok), flush=True)
          repo = "ai4bharat/IndicF5"
          ckpt  = hf_hub_download(repo, "model.safetensors", token=tok)
          vocab = hf_hub_download(repo, "checkpoints/vocab.txt", token=tok)
          print("ckpt:", ckpt, "| vocab:", vocab, flush=True)
          ref = "engines/PIPER/tests/fixtures/ref_hi.wav"
          ref_text = open("engines/PIPER/tests/fixtures/ref_hi.txt", encoding="utf-8").read().strip()
          line = "दादी ने कहा, बेटा, आ जा पास। आज बहुत देर कर दी तूने।"
          try:
              from f5_tts.api import F5TTS
              print("loading model (cpu)...", flush=True)
              f5 = F5TTS(model_type="F5-TTS", ckpt_file=ckpt, vocab_file=vocab,
                         vocoder_name="vocos", device="cpu")
              print("MODEL_LOADED", flush=True)
              wav, sr, _ = f5.infer(ref_file=ref, ref_text=ref_text, gen_text=line,
                                    show_info=print)
              import soundfile as sf
              sf.write("indicf5_out.wav", wav, sr)
              print("RENDER_OK", len(wav), "samples @", sr, "=", round(len(wav)/sr, 2), "s", flush=True)
          except Exception as e:
              print("RENDER_FAIL", type(e).__name__, str(e)[:400], flush=True)
              traceback.print_exc()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indicf5-test
          path: |
            indicf5_out.wav
            indicf5_log.txt
          retention-days: 7
