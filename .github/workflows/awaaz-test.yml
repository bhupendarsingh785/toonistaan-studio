name: Awaaz test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awaaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q numpy edge-tts

      - name: Keys check
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          [ -z "$FREESOUND_API_KEY" ] && echo "FREESOUND_KEY: nahi" || echo "FREESOUND_KEY: mili (${#FREESOUND_API_KEY})"
          [ -z "$ELEVENLABS_API_KEY" ] && echo "ELEVEN_KEY: nahi (edge-tts chalega)" || echo "ELEVEN_KEY: mili (${#ELEVENLABS_API_KEY})"

      - name: Cinema (kahani se audio drama)
        env:
          PYTHONUNBUFFERED: "1"
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python astra/cinema.py banao studio/series/user/story_demo.json -o cinema-demo.mp3

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awaaz
          path: |
            cinema-demo.mp3
            cinema-demo.cues.json
          if-no-files-found: warn
          retention-days: 14
