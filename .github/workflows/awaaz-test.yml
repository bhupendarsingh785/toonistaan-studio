name: Awaaz test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awaaz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q --upgrade pip
          pip install -q numpy edge-tts
      - name: Awaaz studio (Pocket FM)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/awaaz_studio.py sunao studio/series/user/awaaz_demo.json -o awaaz-demo.mp3 --mahaul village --music calm
      - name: Cinema (kahani se audio drama)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python astra/cinema.py banao studio/series/user/story_demo.json -o cinema-demo.mp3
      - name: Sound pack (ASTRA generators)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python astra/astra.py pack -o pack
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awaaz
          path: |
            awaaz-demo.mp3
            cinema-demo.mp3
            cinema-demo.cues.json
            pack/*.wav
          if-no-files-found: warn
          retention-days: 14
