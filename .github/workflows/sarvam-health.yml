name: sarvam-health

on:
  push:
    paths: [".sarvam-trigger"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q requests soundfile numpy
      - name: sarvam api check (ek chhoti line)
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          python - <<'PY' 2>&1 | tee sarvam_health.txt
          import os, json, base64, requests, subprocess, numpy as np, soundfile as sf
          key = os.environ.get("SARVAM_API_KEY")
          print("key present:", bool(key), flush=True)
          if not key:
              print("RESULT: NO_KEY"); raise SystemExit(0)
          text = "नमस्ते, मैं दादी हूँ।"
          payload = {"text": text, "target_language_code": "hi-IN",
                     "speaker": "anushka", "model": "bulbul:v3"}
          url = "https://api.sarvam.ai/text-to-speech"
          r = requests.post(url, json=payload, headers={"api-subscription-key": key,
                                                        "Content-Type": "application/json"}, timeout=90)
          print("http:", r.status_code, flush=True)
          if r.status_code != 200:
              print("RESULT: FAIL", r.text[:200]); raise SystemExit(0)
          data = r.json()
          audio = data.get("audios") or []
          if not audio:
              print("RESULT: NO_AUDIO"); raise SystemExit(0)
          raw = base64.b64decode(audio[0])
          open("sarvam_out.wav","wb").write(raw)
          subprocess.run(["ffmpeg","-loglevel","error","-y","-i","sarvam_out.wav","-ac","1","-ar","16000","-c:a","pcm_s16le","m.wav"], check=False)
          try:
              x, sr = sf.read("m.wav")
              dur = len(x)/sr
              N,H = int(0.04*sr), int(0.02*sr); f0=[]
              for i in range(0, max(1,len(x)-N), H):
                  f = x[i:i+N]
                  if np.sqrt((f**2).mean()) < 0.02: continue
                  f = f - f.mean(); ac = np.correlate(f,f,"full")[N-1:]
                  lo,hi = int(sr/400), int(sr/70)
                  if hi >= len(ac): continue
                  k = lo+int(np.argmax(ac[lo:hi]))
                  if k>0: f0.append(sr/k)
              print("RESULT: OK", json.dumps({"dur": round(dur,2), "hz": int(np.median(f0)) if f0 else 0,
                                              "bytes": len(raw)}))
          except Exception as e:
              print("RESULT: OK_RAW", len(raw), type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarvam-health
          path: |
            sarvam_health.txt
            sarvam_out.wav
            m.wav
          retention-days: 3
