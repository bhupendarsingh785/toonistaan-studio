<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASTRA — Kahani se Audio Drama</title>
<style>
  :root{--bg:#07070e;--card:#13131f;--line:#26263a;--txt:#eef0ff;--dim:#9aa0c0;--vio:#7c5cff;--pink:#ff3fa4;--green:#00d4b4;--amber:#ffb020}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 600px at 50% -10%,#1a1440,#07070e 60%);color:var(--txt);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 70px}
  h1{font-size:23px;margin:6px 0 2px;text-align:center}
  .sub{color:var(--dim);font-size:13px;text-align:center;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  label{font-size:12.5px;color:var(--dim);display:block;margin-bottom:4px}
  input,textarea,select{width:100%;background:#0f0f18;border:1px solid var(--line);color:var(--txt);
       border-radius:10px;padding:10px;font-size:15px;font-family:inherit}
  textarea{min-height:120px;line-height:1.55}
  button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
  .pri{background:linear-gradient(135deg,var(--vio),var(--pink));color:#fff;width:100%;padding:15px;font-size:16px}
  .ghost{background:#1b1b2a;color:var(--txt);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .hint{color:var(--dim);font-size:12px}
  .chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;background:#1b1b2a;border:1px solid var(--line);color:var(--dim);margin:2px 4px 2px 0}
  audio{width:100%;margin-top:10px}
  .ok{color:var(--green)} .warn{color:var(--amber)} .err{color:#ff7a7a}
  ul{padding-left:18px;margin:6px 0}
  li{margin:4px 0;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 ASTRA</h1>
  <div class="sub">Kahani likho → dialogue + SFX + mahaul + music ke saath <b>audio drama</b></div>

  <div class="card">
    <label>Kahani ka naam</label>
    <input id="title" value="दो दीये — छोटू और दादी" />
    <label style="margin-top:10px">Scene (JSON) — har line: [kirdaar, text, bhaav]</label>
    <textarea id="scenes">[
 {"env":"village","music":"calm","lines":[
   ["madhur","गाँव के छोटे से घर में सुबह हो रही थी। दादी चूल्हा जला रही थीं।","calm"],
   ["swara_bachcha","दादी! देखो, मेरी गुल्लक में सौ रुपये हो गए!","excited"],
   ["swara_dadi","अरे वाह बेटा... इतने पैसे कहाँ से आए?","surprised"]
 ]},
 {"env":"street","music":"sad","lines":[
   ["madhur","दरवाज़ा खुला और कदमों की आहट आई।","calm"],
   ["swara_dadi","तूने छुपाया मुझसे? मेरा बच्चा बड़ा हो गया।","sad"]
 ]},
 {"env":"village","music":"happy","lines":[
   ["madhur","उस रात आँगन में दो दीये जले, और घर में खुशी की रोशनी भर गई।","happy"]
 ]}
]</textarea>
    <div class="row">
      <span class="chip">env: village / street / jungle / room / temple / night</span>
      <span class="chip">music: calm / sad / happy / action / horror / romance</span>
    </div>
    <button class="pri" id="go" style="margin-top:12px">🎧 Audio drama banao</button>
    <div class="hint" id="msg" style="margin-top:8px"></div>
    <audio id="player" controls style="display:none"></audio>
    <div class="hint" id="cues" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <label>Ek awaaz banao (ASTRA engine)</label>
    <div class="row">
      <input id="sfxText" placeholder="jaise: mitti par bhaari kadam, paas se" style="flex:2;min-width:200px" />
      <button class="ghost" id="sfxGo">🔊 banao</button>
    </div>
    <div class="hint" id="sfxMsg" style="margin-top:6px"></div>
    <audio id="sfxPlayer" controls style="display:none"></audio>
    <div class="hint" id="sounds" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <label>Meri kahaniyan</label>
    <ul id="stories"></ul>
    <button class="ghost" id="refresh">↻ refresh</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
function setMsg(t, cls){ const m=$("#msg"); m.textContent=t; m.className="hint "+(cls||""); }

async function loadSounds(){
  try{
    const r = await fetch("/api/sounds"); const d = await r.json();
    const parts = Object.entries(d.categories).map(([k,v])=>`<span class="chip">${k}: ${v.length}</span>`);
    $("#sounds").innerHTML = `kul ${d.total} awaazein — ` + parts.join("");
  }catch(e){}
}

async function loadStories(){
  try{
    const r = await fetch("/api/stories"); const list = await r.json();
    $("#stories").innerHTML = list.length ? list.map(s=>`<li>${s.title} ${s.audio?`— <a href="${s.audio}" target="_blank" style="color:#9b8cff">sunо</a>`:""}</li>`).join("") : "<li class='hint'>abhi koi kahani nahi</li>";
  }catch(e){ $("#stories").innerHTML = "<li class='hint'>server se baat nahi hui</li>"; }
}

$("#go").onclick = async () => {
  let scenes;
  try{ scenes = JSON.parse($("#scenes").value); }
  catch(e){ return setMsg("Scene JSON galat hai: " + e.message, "err"); }
  setMsg("⏳ Kahani bhej raha hoon...");
  try{
    const c = await fetch("/api/stories", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({title: $("#title").value, scenes})});
    const {id} = await c.json();
    setMsg("🎧 Audio ban raha hai... (1-3 min)");
    const r = await fetch(`/api/stories/${id}/render`, {method:"POST"});
    if(!r.ok){ const t = await r.text(); throw new Error(t.slice(0,160)); }
    const d = await r.json();
    const p = $("#player"); p.src = d.audio; p.style.display="block"; p.play().catch(()=>{});
    setMsg("✅ Taiyar! Neeche sunо", "ok");
    $("#cues").innerHTML = `Cue sheet: <a href="${d.cues}" target="_blank" style="color:#9b8cff">yahan</a>`;
    loadStories();
  }catch(e){ setMsg("❌ " + e.message, "err"); }
};

$("#sfxGo").onclick = async () => {
  const t = $("#sfxText").value.trim();
  if(!t) return;
  $("#sfxMsg").textContent = "⏳ ban raha hai...";
  try{
    const r = await fetch("/api/sound", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text:t})});
    const d = await r.json();
    const p = $("#sfxPlayer"); p.src = d.file; p.style.display="block"; p.play().catch(()=>{});
    $("#sfxMsg").textContent = `✅ ${d.generator} · ${d.qa.seconds}s · peak ${d.qa.peak}`;
  }catch(e){ $("#sfxMsg").textContent = "❌ " + e.message; }
};

$("#refresh").onclick = loadStories;
loadSounds(); loadStories();
</script>
</body>
</html>
