<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seetal Voice — browser me asli andaaz</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --ink:#e8ecf3; --mut:#9aa4b2; --acc:#7c5cff; --ok:#2ecc71; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Nirmala UI",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px; border-bottom:1px solid #23262f; display:flex; gap:10px; align-items:center; }
  h1 { font-size:17px; margin:0; }
  .pill { font-size:11px; background:#222736; color:var(--mut); padding:3px 8px; border-radius:99px; }
  main { padding:16px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #23262f; border-radius:14px; padding:14px; margin-bottom:12px; }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:4px; }
  select, textarea, button { font:inherit; }
  select, textarea { width:100%; background:#0f131a; color:var(--ink); border:1px solid #2a2f3c; border-radius:10px; padding:10px; }
  textarea { min-height:96px; resize:vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:10px; padding:12px 16px; font-weight:600; cursor:pointer; }
  button.ghost { background:#232736; color:var(--ink); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .meter { height:8px; background:#0f131a; border-radius:99px; overflow:hidden; margin-top:6px; }
  .meter > i { display:block; height:100%; width:0; background:var(--ok); transition:width .15s; }
  .small { font-size:12px; color:var(--mut); }
  .line { border-left:3px solid #2a2f3c; padding-left:10px; margin:8px 0; }
  .who { font-size:12px; color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>Seetal Voice</h1>
  <span class="pill" id="enginePill">browser TTS</span>
  <span class="pill">offline · free</span>
</header>
<main>
  <div class="card">
    <div class="row">
      <div>
        <label for="scene">Kahani ka hissa</label>
        <select id="scene">
          <option value="emotional">Bhaavuk (dukh + pyaar)</option>
          <option value="horror">Daravani (dar + suspense)</option>
          <option value="happy">Khushi (josh)</option>
        </select>
      </div>
      <div>
        <label for="gap">Pause (second)</label>
        <select id="gap">
          <option value="auto" selected>Auto (kirdaar ke hisaab se)</option>
          <option value="0.4">0.4 s (tez)</option>
          <option value="1.5">1.5 s</option>
          <option value="3">3.0 s (thehra — RISHTEY jaisa)</option>
        </select>
      </div>
    </div>
    <p class="small" id="hint">Sur aur raftaar asli insaan ke naap se aaye hain (96 / 146 / 213 / 300 Hz).</p>
  </div>

  <div class="card">
    <label>Script (har line: kirdaar | bhaav | baat)</label>
    <textarea id="script"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="play">Suno</button>
      <button id="stop" class="ghost">Roko</button>
      <button id="sample" class="ghost">Sample bharo</button>
    </div>
    <div class="meter"><i id="bar"></i></div>
    <p class="small" id="status">Taiyar.</p>
  </div>

  <div class="card">
    <label>Awaaz (device me jo hai)</label>
    <select id="voice"></select>
    <p class="small">Phone me Hindi voice na ho to English voice par bhi chalega — sur/raftaar wahi rahega.</p>
  </div>

  <div class="card">
    <div id="out"></div>
  </div>
</main>

<script>
const PRESETS = {
  characters: {
    narrator: { f0: 96,  pace: 3.09, pause: 2.6 },
    dada:     { f0: 96,  pace: 3.09, pause: 2.6 },
    purush:   { f0: 146, pace: 3.45, pause: 1.6 },
    maa:      { f0: 213, pace: 4.29, pause: 1.4 },
    gudiya:   { f0: 232, pace: 4.29, pause: 1.2 },
    sonu:     { f0: 300, pace: 3.63, pause: 1.0 }
  },
  emotion_map: {
    neutral: { pitch_mul: 1.00, rate_mul: 1.00, pause_mul: 1.0 },
    pyaar:   { pitch_mul: 0.97, rate_mul: 0.94, pause_mul: 1.3 },
    khushi:  { pitch_mul: 1.06, rate_mul: 1.08, pause_mul: 0.8 },
    dukh:    { pitch_mul: 0.93, rate_mul: 0.88, pause_mul: 1.6 },
    dar:     { pitch_mul: 1.04, rate_mul: 1.12, pause_mul: 0.7 },
    gussa:   { pitch_mul: 1.02, rate_mul: 1.15, pause_mul: 0.6 },
    hairan:  { pitch_mul: 1.08, rate_mul: 1.05, pause_mul: 0.9 }
  }
};
const SAMPLES = {
  emotional: `narrator | neutral | बीस रुपये का एक पपीता तो मैं खुद खरीद कर लाती हूँ आंटी।
maa | pyaar | सही रेट लगाओ बेटा। झूठ मत बोलो।
sonu | khushi | मेरा नाम गोलू है दीदी।
narrator | dukh | जब बात रिश्तों की हो, तो हानि लाभ नहीं देखते।`,
  horror: `narrator | dar | बेटा, उस पुरानी हवेली के पास मत जाना।
sonu | dar | दादी, आपने वो आवाज़ सुनी थी?
dada | gussa | चुप! आवाज़ आ रही है। सुन...
narrator | dar | देखा? वह आज भी गिनती करता है। एक, दो, तीन... चार।`,
  happy: `sonu | khushi | दादी आ गईं! दादी आ गईं!
gudiya | khushi | दादी, आप चिंता मत करना।
maa | pyaar | बेटी, शहर जाकर अपना ध्यान रखना।`
};

const $ = (id) => document.getElementById(id);
let voices = [], queue = [], idx = 0, playing = false;

function fillVoices() {
  voices = speechSynthesis.getVoices();
  const sel = $("voice");
  sel.innerHTML = "";
  voices.forEach((v, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = `${v.name} (${v.lang})`;
    if (v.lang && v.lang.startsWith("hi")) o.selected = true;
    sel.appendChild(o);
  });
  $("enginePill").textContent = voices.length ? `${voices.length} voices` : "browser TTS";
}
speechSynthesis.onvoiceschanged = fillVoices;
fillVoices();

function parseScript(text) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
    const parts = line.split("|").map(p => p.trim());
    if (parts.length >= 3) return { who: parts[0], emo: parts[1], text: parts.slice(2).join(" ") };
    if (parts.length === 2) return { who: parts[0], emo: "neutral", text: parts[1] };
    return { who: "narrator", emo: "neutral", text: line };
  });
}

function settings(line) {
  const c = PRESETS.characters[line.who] || PRESETS.characters.narrator;
  const e = PRESETS.emotion_map[line.emo] || PRESETS.emotion_map.neutral;
  const pitch = Math.max(0.1, Math.min(2, (c.f0 / 120) * e.pitch_mul));
  const rate = Math.max(0.5, Math.min(1.6, (c.pace / 4.0) * e.rate_mul));
  let pause = c.pause * e.pause_mul;
  const g = $("gap").value;
  if (g !== "auto") pause = parseFloat(g);
  return { pitch, rate, pause, f0: c.f0 };
}

function speakNext() {
  if (!playing) return;
  if (idx >= queue.length) { finish(); return; }
  const line = queue[idx];
  const s = settings(line);
  const u = new SpeechSynthesisUtterance(line.text);
  u.pitch = s.pitch; u.rate = s.rate; u.lang = "hi-IN";
  const vi = parseInt($("voice").value, 10);
  if (!isNaN(vi) && voices[vi]) u.voice = voices[vi];
  u.onstart = () => {
    $("status").textContent = `${line.who} (${line.emo}) — ${s.f0} Hz · pitch ${s.pitch.toFixed(2)} · rate ${s.rate.toFixed(2)}`;
    $("bar").style.width = `${Math.round((idx / queue.length) * 100)}%`;
  };
  u.onend = () => {
    idx++;
    setTimeout(speakNext, s.pause * 1000);
  };
  u.onerror = () => { idx++; setTimeout(speakNext, 300); };
  speechSynthesis.speak(u);
}

function finish() {
  playing = false;
  $("bar").style.width = "100%";
  $("status").textContent = "Khatam.";
  $("play").disabled = false;
}

$("play").onclick = () => {
  const lines = parseScript($("script").value);
  if (!lines.length) { $("status").textContent = "Pehle script likho."; return; }
  speechSynthesis.cancel();
  queue = lines; idx = 0; playing = true;
  $("play").disabled = true;
  $("out").innerHTML = lines.map(l => {
    const s = settings(l);
    return `<div class="line"><div class="who">${l.who} · ${l.emo} · ${s.f0} Hz</div>${l.text}</div>`;
  }).join("");
  speakNext();
};
$("stop").onclick = () => { playing = false; speechSynthesis.cancel(); $("play").disabled = false; $("status").textContent = "Roka."; };
$("sample").onclick = () => { $("script").value = SAMPLES[$("scene").value]; $("status").textContent = "Sample bhar diya."; };
$("scene").onchange = () => { $("script").value = SAMPLES[$("scene").value]; };
$("script").value = SAMPLES.emotional;
</script>
</body>
</html>
