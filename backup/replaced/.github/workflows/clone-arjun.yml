name: clone-arjun

on:
  push:
    paths:
      - ".clone-trigger"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q "coqui-tts" soundfile numpy 2>&1 | tail -3
      - name: clone + render
        env:
          COQUI_TOS_AGREED: "1"
        run: |
          python - <<'PY' 2>&1 | tee clone_log.txt
          import os, traceback
          ref = "voices/arjun/reference.wav"
          print("ref exists:", os.path.exists(ref), os.path.getsize(ref) if os.path.exists(ref) else 0, flush=True)
          LINES = [
            ("neutral", "नमस्ते, मेरा नाम अर्जुन सिंह है। मैं कार्टून वीडियो और रिकॉर्डिंग बनाता हूँ।"),
            ("neutral", "आज मैं आपको एक छोटी सी कहानी सुनाता हूँ — एक लड़के की, जो रोज़ सुबह ट्रेन देखने जाता था।"),
            ("dukh",    "उस दिन स्टेशन पर बहुत सन्नाटा था। ट्रेन आई, और वो चला गया — हमेशा के लिए।"),
            ("khushi",  "लेकिन कहानी यहीं खत्म नहीं होती। सालों बाद वही लड़का लौटा, और सबको हँसा कर गया।"),
          ]
          try:
              from TTS.api import TTS
              print("loading xtts_v2…", flush=True)
              tts = TTS("tts_models/multilingual/multi-dataset/xtts_v2").to("cpu")
              print("MODEL_LOADED", flush=True)
              os.makedirs("clone_out", exist_ok=True)
              for i, (emo, text) in enumerate(LINES, 1):
                  out = f"clone_out/{i:02d}_{emo}.wav"
                  tts.tts_to_file(text=text, speaker_wav=ref, language="hi", file_path=out)
                  print("RENDER_OK", out, os.path.getsize(out), flush=True)
          except Exception as e:
              print("RENDER_FAIL", type(e).__name__, str(e)[:300], flush=True)
              traceback.print_exc()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-arjun
          path: |
            clone_out/*
            clone_log.txt
          retention-days: 7
