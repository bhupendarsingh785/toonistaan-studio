<script>
// Toonistaan World3D: kirdaar library (insaan har umar/ling, janwar, panchhi, ped). WebGL2 ray-march.
const FS = `#version 300 es
precision highp float;
uniform vec2 R; uniform float T; uniform vec3 camPos, camTgt;
uniform vec4 cPos[12];  // xyz, rotY
uniform vec4 cTyp[12];  // x=type, y,z,w = params

uniform vec4 cSkin[12]; uniform vec4 cHair[12]; uniform vec4 cBody[12]; uniform vec4 cEye[12]; uniform vec4 cPant[12]; // rgb + w=1 agar diya ho
vec3 entCol[4]; bool entHas[4];  // x=rang(0 gora..3 kaala), y=kaathi(-1 patla..1 mota), z=lambai, w=haisiyat(0 garib,1 aam,2 amir)
vec4 X;
uniform int cN; uniform float env; uniform float zoom; // env 0 gaon, 1 jungle
out vec4 O;
float fly;
float sdS(vec3 p,float r){return length(p)-r;}
float sdE(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/k1;}
float sdC(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdRB(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdCone(vec3 p,float h,float r1,float r2){vec2 q=vec2(length(p.xz),p.y);vec2 k1=vec2(r2,h),k2=vec2(r2-r1,2.*h);vec2 ca=vec2(q.x-min(q.x,(q.y<0.)?r1:r2),abs(q.y)-h);vec2 cb=q-k1+k2*clamp(dot(k1-q,k2)/dot(k2,k2),0.,1.);float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
float sdTor(vec3 p,float R,float r){return length(vec2(length(p.xy)-R,p.z))-r;}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 chhotuM(vec3 p,float talk,float wave){
  float b=sin(T*5.)*.04*(1.-fly); p.y-=b;
  vec2 d=vec2(sdRB(p-vec3(0,1.15,0),vec3(.62,.55,.5),.38),2.);
  d=U(d,vec2(sdRB(p-vec3(0,1.17,.33),vec3(.45,.32,.2),.24),3.));
  float bl=fract(T*.31)<.04?.15:1.;
  vec3 e=p-vec3(0,1.22,.5);e.x=abs(e.x)-.19;
  d=U(d,vec2(sdE(e,vec3(.11,.14*bl,.06)),4.));
  vec3 pu=p-vec3(0,1.26,.555);pu.x=abs(pu.x)-.16;
  d=U(d,vec2(sdS(pu,.04*bl),9.));
  float m=sdC(p,vec3(-.12,1.02+.0,.53),vec3(.12,1.02,.53),.025+.03*talk*abs(sin(T*16.)));
  d=U(d,vec2(m,4.));
  vec3 ck=p-vec3(0,1.07,.5);ck.x=abs(ck.x)-.36;d=U(d,vec2(sdS(ck,.07),11.));
  d=U(d,vec2(sdC(p,vec3(0,1.7,0),vec3(sin(T*3.)*.05,2.0,0),.035),10.));
  d=U(d,vec2(sdS(p-vec3(sin(T*3.)*.05,2.05,0),.09),5.));
  // arms
  vec3 sl=vec3(-.68,1.1,0),sr=vec3(.68,1.1,0);
  vec3 hl=sl+vec3(-.18,-.42,.05);
  vec3 hr=sr+mix(vec3(.18,-.42,.05),vec3(.28,.38+.08*sin(T*12.),.05),wave);
  d=U(d,vec2(min(sdC(p,sl,hl,.09),sdC(p,sr,hr,.09)),2.));
  d=U(d,vec2(min(sdS(p-hl,.13),sdS(p-hr,.13)),10.));
  // legs
  vec3 q=p;q.x=abs(q.x)-.25;
  float lg=sdC(q,vec3(0,.6,0),vec3(0,.18-.12*fly,0),.1);
  d=U(d,vec2(lg,10.));
  d=U(d,vec2(sdRB(q-vec3(0,.1-.12*fly,.06),vec3(.14,.08,.2),.07),2.));
  return d;
}

// g: 0 aurat/ladki, 1 aadmi/ladka; age: 0 bachcha, 1 jawan, 2 budha; o: kapde ka rang variant
vec2 person(vec3 P,float g,float age,float o,float talk,float wave){

  head=smin(head,sdS(h-vec3(0,-.032,.104),g>.5?.013:.011),.01);

  vec3 es=h-vec3(0,.012,.097);es.x=abs(es.x)-.035;head=smin(head,-(sdE(es,vec3(.028,.018,.01))),-.006);head=max(head,-sdE(es,vec3(.026,.016,.008)));
  vec2 d=vec2(head*hs,skin);
  // aankhein: badaam jaisi, badi putli, palkon ki lakeer

  vec3 ir=e-vec3(0,-.001,.013);
  d=U(d,vec2(sdS(ir,.0118)*ek*hs,19.));
  d=U(d,vec2(sdS(ir-vec3(0,0,.0048),.0062)*ek*hs,10.));
  d=U(d,vec2(sdS(ir-vec3(.0045,.0045,.0095),.0024)*ek*hs,9.));
  float lidY=mix(.0125,-.02,bl);

  d=U(d,vec2(lid*hs,skin));
  vec3 lsh=e-vec3(0,lidY+.001,.006);
  d=U(d,vec2(max(sdE(lsh,vec3(.027,.0045,.016)),-lsh.z+.004)*ek*hs,10.)); // palkon ki lakeer
  if(g<.5&&bl<.5){for(int k=0;k<3;k++){float fk=float(k);vec3 lb=vec3(.012+fk*.006,lidY+.002,.008-fk*.003);
    d=U(d,vec2(sdC(e,lb,lb+vec3(.006+fk*.002,.007,.004),.0012)*ek*hs,10.));}} // lashes
  // bhaunh: moti, mudi hui
  vec3 b=h-vec3(0,.043,.088);b.x=abs(b.x)-.036;
  float wh=age>1.5?17.:7.;
  float bw=g>.5?.006:.0038;
  vec3 bb=b;bb.y+=bb.x*bb.x*4.;float brow=sdE(bb-vec3(.002,.004,0),vec3(.026,bw,.006));
  d=U(d,vec2(brow*hs,wh));
  // honth: muskaan
  float op=talk*abs(sin(T*15.))*.011;
  vec3 l=h-vec3(0,-.07,.087);l.y-=l.x*l.x*3.;
  float lips=min(sdE(l-vec3(0,.003,-.002),vec3(.022,.004,.009)),sdE(l-vec3(0,-.005-op,-.003),vec3(.019,.005,.009)));
  d=U(d,vec2(lips*hs,g<.5&&age>.5?61.:20.));
  if(g<.5||age<.5){vec3 bh=h-vec3(0,-.03,.083);bh.x=abs(bh.x)-.05;d=U(d,vec2((sdE(bh,vec3(.02,.013,.006))+.0035)*hs,62.));} // gaalon ki laali
  if(g>.5&&age>.5&&age<1.5&&fract(o*.31)>.4){float st=max(sdE(h-vec3(0,-.074,.02),vec3(.067,.05,.078)),-(h.y+.04));d=U(d,vec2(st*hs,63.));} // halki daadhi
  if(op>.002)d=U(d,vec2(sdE(l-vec3(0,-op*.5,-.003),vec3(.02,op*.6+.002,.008))*hs,10.));
  // baal
  float hair;
  if(g<.5){
    hair=max(sdE(h-vec3(0,.016,-.012),vec3(.098,.122,.108)),-max(h.y-.058,-(h.z+.005)));
    if(age<.5){vec3 pt=h-vec3(0,0,-.04);pt.x=abs(pt.x)-.1;hair=min(hair,min(sdS(pt,.04),sdC(pt,vec3(.01,-.02,-.01),vec3(.02,-.13,-.02),.026)));
      d=U(d,vec2(sdE(pt-vec3(.004,-.008,0),vec3(.016,.03,.03))*hs,5.));}
    else {hair=min(hair,sdS(h-vec3(0,.02,-.13),.055));  // joodaa
      if(age<1.5){ // lambe khule baal: peeche peeth tak + chehre ke dono taraf lat
        float lh=sdE(h-vec3(0,-.12,-.065),vec3(.1,.2,.055));lh=max(lh,-(h.z-.0));
        vec3 lt=h;lt.x=abs(lt.x)-.088;lh=min(lh,sdC(lt,vec3(0,.04,.02),vec3(.012,-.2,-.01),.02));
        lh+=.0018*sin(h.x*90.+h.y*20.);
        hair=smin(hair,lh,.03);}} // lambe baal
    d=U(d,vec2(hair*hs,wh));
    if(age>.5){vec3 bd=h-vec3(0,.02,.098);d=U(d,vec2(sdS(bd,.006)*hs,5.));} // bindi
  } else {
    if(age>1.5){hair=max(sdE(h-vec3(0,-.004,-.008),vec3(.096,.116,.105)),max(h.y-.035,h.z-.03));
      if(mod(floor(o),2.)>.5){float bd2=sdE(h-vec3(0,-.11,.06),vec3(.06,.06,.045));bd2=smin(bd2,max(sdE(h-vec3(0,-.07,.03),vec3(.072,.05,.07)),-(h.y+.05)),.02);bd2+=.0015*sin(h.x*120.);d=U(d,vec2(bd2*hs,17.));} // safed daadhi
      vec3 mu=h-vec3(0,-.052,.1);mu.x=abs(mu.x)-.024;mu.xy*=rot(-.35);d=U(d,vec2(sdE(mu,vec3(.03,.011,.014))*hs,17.));}
    else {hair=max(sdE(h-vec3(0,.025,-.01),vec3(.097,.115,.106)),-max(h.y-.055,-(h.z+.02)));
      float top=sdE(h-vec3(.01,.075,.0),vec3(.094,.045,.098));
      vec3 sw=h-vec3(-.025,.075,.075);sw.xy*=rot(.45);sw.yz*=rot(-.3);
      top=smin(top,sdE(sw,vec3(.065,.02,.035)),.025); // maathe par sanwara hua jhonka
      top=max(top,-(h.y-.035-(h.z>.06?.03:0.)));
      hair=smin(hair,top,.02);
      hair+=.0012*sin(atan(h.z,h.x)*22.+h.y*30.)*smoothstep(.03,.08,h.y); // baalon ki lehren
      if(age>.5&&fract(o*.31)>.4){vec3 mu=h-vec3(0,-.05,.1);mu.x=abs(mu.x)-.018;mu.xy*=rot(-.25);d=U(d,vec2(sdE(mu,vec3(.022,.007,.01))*hs,7.));}}
    d=U(d,vec2(hair*hs,wh));
  }
  if(age>1.5){vec3 gl=h-vec3(0,.012,.103);gl.x=abs(gl.x)-.036;d=U(d,vec2(min(sdTor(gl,.024,.0028),sdC(h,vec3(-.012,.014,.105),vec3(.012,.014,.105),.0025))*hs,10.));}
  // sharir
  float neck=sdC(p,vec3(0,1.42,0),vec3(0,1.53,-.005),g<.5?.04:.048);
  vec3 a=p;a.x=abs(a.x);float side=sign(p.x);
  vec3 sh=g<.5?vec3(.165,1.39,0):vec3(.195,1.39,0);
  vec3 el=sh+vec3(.035,-.26,.03),wr=sh+vec3(.04,-.49,.07);
  if(wave>.5&&side>0.){el=sh+vec3(.12,.12,.05);wr=el+vec3(.04,.22+.03*sin(T*12.),0);}
  float tor;
  if(g<.5){tor=smin(smin(sdE(p-vec3(0,1.28,.005),vec3(.135,.13,.09)),sdE(p-vec3(0,1.1,0),vec3(.1,.07,.075)),.06),sdE(p-vec3(0,.96,0),vec3(.135,.1,.095)),.06);}
  else {tor=smin(smin(sdE(p-vec3(0,1.27,.005),vec3(.17,.15,.1)),sdE(p-vec3(0,1.07,age>1.5?.02:0.),vec3(age>1.5?.155:.14,.14,age>1.5?.11:.095)),.08),sdE(p-vec3(0,.95,0),vec3(.15,.09,.1)),.06);}
  tor-=fat*.035; if(fat>.3&&g>.5)tor=smin(tor,sdE(p-vec3(0,1.05,.06),vec3(.15,.13,.11)*(1.+fat*.4)),.06);
  tor=smin(tor,sdC(a,vec3(.035,1.45,-.01),sh+vec3(-.01,.015,0),.048),.05);
  tor=smin(tor,sdS(a-sh,.05),.04);
  float arm=smin(sdC(a,sh,el,.041),sdC(a,el,wr,.033),.02)-fat*.012;
  vec3 hd=wr+(wave>.5&&side>0.?vec3(0,.05,0):vec3(.003,-.055,.005));
  float hand=sdE(a-hd-vec3(0,.012,0),vec3(.026,.03,.013));
  bool up=wave>.5&&side>0.;
  for(int f=0;f<4;f++){float fx=-.018+float(f)*.012;float fl=(f==1||f==2)?.048:.04;
    vec3 fb=hd+vec3(fx,up?.035:-.012,0.);vec3 ft=fb+vec3(fx*.25,up?fl:-fl,up?0.:.008);
    hand=smin(hand,sdC(a,fb,ft,.0068),.006);}
  vec3 tb=hd+vec3(-.022,up?.0:.008,.012);hand=smin(hand,sdC(a,tb,tb+vec3(-.012,up?.025:-.022,.018),.0075),.006);
  vec3 gg=p;gg.x=abs(gg.x);
  float leg=smin(sdC(gg,vec3(.085,.94,0),vec3(.09,.52,.01),.064),sdC(gg,vec3(.09,.52,.01),vec3(.09,.1,0),.046),.03)-fat*.015;
  float foot=sdE(gg-vec3(.09,.045,.05),vec3(.045,.04,.11));
  d=U(d,vec2(neck*s,skin));d=U(d,vec2(hand*s,skin));d=U(d,vec2(foot*s,18.));
  float oc=mod(floor(o),3.); // kapdon ke rang
  float poor=wl<.5?1.:0.;float rich=wl>1.5?1.:0.;
  if(g<.5&&age<.5){ // frock
    float fr=smin(tor-.012,sdCone(p-vec3(0,.84,0),.22,.33,.105),.07);
    fr=smin(fr,sdTor((p-vec3(0,.6,0)).xzy,.315,.028),.04);
    float fm=poor>.5?45.:(oc<.5?8.:(oc<1.5?34.:37.));
    d=U(d,vec2(fr*s,fm));d=U(d,vec2(sdS(a-sh-vec3(.01,-.03,0),.07)*s,fm));
    d=U(d,vec2(sdTor((p-vec3(0,1.1,0)).xzy,.106,.011)*s,5.));
    d=U(d,vec2(arm*s,skin));d=U(d,vec2(leg*s,skin));
  } else if(g<.5){ // saree
    float sm=poor>.5?(oc<.5?45.:46.):(age>1.5?21.:(oc<.5?35.:(oc<1.5?36.:34.)));
    float blouse=tor-.01;
    d=U(d,vec2(blouse*s,age>1.5?21.:38.));
    float skirt=sdCone(p-vec3(0,.5,0),.5,.2,.115);
    d=U(d,vec2(skirt*s,sm));
    // pallu: kandhe se kamar tak tirchha
    vec3 pq=p-vec3(0,1.18,.0);pq.xy*=rot(.55);
    float pallu=max(sdE(pq,vec3(.08,.32,.115)),-sdE(pq,vec3(.06,.3,.09)));pallu=max(pallu,-(p.y-.82));
    d=U(d,vec2(min(pallu,sdRB(pq-vec3(0,0,0),vec3(.06,.3,.11),.03))*s,sm));
    d=U(d,vec2(sdTor((p-vec3(0,.04,0)).xzy,.2,.018)*s,rich>.5?47.:5.)); // border
    if(rich>.5){d=U(d,vec2(sdTor((p-vec3(0,1.42,.03)).xzy,.075,.012)*s,47.));vec3 er=h-vec3(0,-.04,0);er.x=abs(er.x)-.095;d=U(d,vec2(sdS(er,.012)*hs*s,47.));}
    float sl=sdC(a,sh,sh+vec3(.02,-.1,.01),.048);d=U(d,vec2(sl*s,age>1.5?21.:38.));
    d=U(d,vec2(arm*s,skin));
  } else if(age>1.5){ // kurta dhoti
    float k=smin(tor-.016,sdCone(p-vec3(0,.86,0),.36,.27,.15),.08);
    d=U(d,vec2(k*s,16.));d=U(d,vec2(sdTor((p-vec3(0,1.465,0)).xzy,.058,.014)*s,16.));
    d=U(d,vec2((arm-.012)*s,16.));
    d=U(d,vec2(smin(leg+.012,sdCone(gg-vec3(.07,.3,0),.25,.1,.12),.04)*s,21.));
    vec3 bu=p-vec3(0,1.3,.105);bu.y=mod(bu.y+.04,.08)-.04;if(p.y>1.15&&p.y<1.45)d=U(d,vec2(sdS(bu,.009)*s,10.));
  } else { // shirt + pant/shorts
    float sm=poor>.5?(oc<.5?45.:46.):(rich>.5?10.:(oc<.5?37.:(oc<1.5?39.:5.)));
    d=U(d,vec2((tor-.012-rich*.006)*s,sm));
    if(rich>.5&&age>.5){ // suit: safed shirt ka V, laal tie, sone ki ghadi
      vec3 v=p-vec3(0,1.33,.1);d=U(d,vec2(max(sdE(v,vec3(.05,.12,.02)),v.y-.12)*s,9.));
      d=U(d,vec2(sdC(p,vec3(0,1.41,.115),vec3(0,1.18,.13),.014)*s,5.));
      d=U(d,vec2(sdTor((a-wr).xzy,.036,.01)*s,47.));}
    d=U(d,vec2(sdTor((p-vec3(0,1.465,0)).xzy,.055,.012)*s,sm));
    d=U(d,vec2(smin(sdC(a,sh,sh+(el-sh)*.5,.05),sdS(a-sh,.055),.03)*s,sm));
    d=U(d,vec2(arm*s,skin));
    vec3 bu=p-vec3(0,1.3,.1);bu.y=mod(bu.y+.04,.08)-.04;if(p.y>1.0&&p.y<1.42)d=U(d,vec2(sdS(bu,.007)*s,9.));
    float pant=smin(sdE(p-vec3(0,.93,0),vec3(.155,.1,.105)),(age<.5?sdC(gg,vec3(.09,.9,0),vec3(.095,.62,.01),.075):leg+.014),.04);
    d=U(d,vec2(pant*s,age<.5?10.:(rich>.5?10.:(poor>.5?46.:40.))));
    if(age<.5)d=U(d,vec2(leg*s,skin));
    d=U(d,vec2(sdTor((p-vec3(0,1.0,0)).xzy,.145,.012)*s,15.)); // belt
  }
  if(age>1.5&&g>.5)d=U(d,vec2(sdC(P,vec3(.3,1.0,.12),vec3(.36,0.,.2),.018),15.));
  return d;
}

vec2 elephant(vec3 p){
  vec2 d=vec2(sdE(p-vec3(0,1.25,0),vec3(.62,.58,.95)),24.);
  vec3 h=p-vec3(0,1.5,.95);
  d.x=smin(d.x,sdS(h,.46),.15);
  vec3 ea=h;ea.x=abs(ea.x)-.42;ea.z+=.15;ea.xz*=rot(.5);d.x=smin(d.x,sdE(ea,vec3(.06,.42,.34)),.04);
  float tr=sdC(p,vec3(0,1.35,1.3),vec3(0,.95,1.5),.12);tr=smin(tr,sdC(p,vec3(0,.95,1.5),vec3(0,.45,1.5+.08*sin(T*2.)),.08),.05);
  d.x=smin(d.x,tr,.08);
  vec3 tk=p-vec3(0,1.1,1.25);tk.x=abs(tk.x)-.16;d=U(d,vec2(sdC(tk,vec3(0),vec3(.03,-.12,.25),.04),9.));
  vec3 e=h-vec3(0,.08,.38);e.x=abs(e.x)-.24;d=U(d,vec2(sdS(e,.045),10.));
  vec3 lg=p;lg.x=abs(lg.x)-.36;lg.z=abs(lg.z)-.55;d.x=smin(d.x,sdC(lg,vec3(0,1.,0),vec3(0,.1,0),.19),.08);
  d=U(d,vec2(sdC(p,vec3(0,1.3,-.95),vec3(0,.7,-1.1),.03),24.));
  return d;
}
vec2 lion(vec3 p){
  vec2 d=vec2(sdE(p-vec3(0,.78,0),vec3(.27,.27,.6)),25.);
  vec3 h=p-vec3(0,1.08,.6);
  d=U(d,vec2(sdS(h-vec3(0,0,-.08),.33+.02*sin(atan(h.y,h.x)*12.)),26.));
  d=U(d,vec2(sdS(h-vec3(0,0,.05),.22),25.));

let gl, prog, E, W, H, loc = {};
const TYPES = {chhotu:1, robot:1, person:2, elephant:3, haathi:3, lion:4, sher:4, monkey:5, bandar:5, cow:6, gaay:6, dog:7, kutta:7, deer:8, hiran:8, parrot:9, tota:9, tree:10, ped:10};

  oldMan:{type:'person',name:'Wise Old Man',g:1,age:2,o:1,height:1.70,skin:'#C99578',hair:'#D6D2CC',eyes:'#443A32',body:'#78916F',style:'wise, friendly, elderly'},
  seth:{type:'person',g:1,age:1,o:0,rang:0,kaathi:.9,haisiyat:2}, sethani:{type:'person',g:0,age:1,o:0,rang:0,kaathi:.5,haisiyat:2},
  kisan:{type:'person',g:1,age:1,o:0,rang:2,kaathi:-.4,haisiyat:0,lambai:.97}, kisanin:{type:'person',g:0,age:1,o:1,rang:2,kaathi:-.2,haisiyat:0},
  garib_bachcha:{type:'person',g:1,age:0,o:0,rang:3,kaathi:-.6,haisiyat:0}, babu:{type:'person',g:1,age:1,o:1,rang:1,kaathi:.2,haisiyat:1,lambai:1.04},

};
function setup(ep, w, h) {
  E = ep; W = w; H = h; const c = document.getElementById('c'); c.width = w; c.height = h;

    if (k.chhotu || true) E.cast.push({id:'chhotu', ...CAST.chhotu, track:k.chhotu || [{t:0,v:[-.9,0,0,.25]}]});

const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);

}
const on = (t, type, who) => (E.actions || []).some(a => a.type === type && (!who || !a.who || a.who === who || (who === 'dada' && a.who === 'dadaji')) && t >= a.start && t <= a.end);
